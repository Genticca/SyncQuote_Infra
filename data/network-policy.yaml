# network-policy.yaml
# Redis api 접근 제어 방화벽 (클러스터 안 Pod 대상)
# 주의: 수집 Redis(redis-collector)는 외부 VM으로 빠져 NetworkPolicy 대상이 아니다.
#       해당 정책은 아래에 제거 사유와 함께 주석으로 남겨둔다.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-api-strict-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: redis-api                # 대상: API용 Redis Pod
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: api                  # 오직 서비스 WAS(api)만 진입 허용
    ports:
    - protocol: TCP
      port: 6379
# [제거됨] redis-collector-strict-policy
#   수집 Redis를 클러스터 밖 sq-data-01 VM으로 외부화하면서 redis-collector는
#   더 이상 Pod가 아니다(Service+Endpoints로 외부 IP를 가리킴 — redis-collector.yaml 참고).
#   NetworkPolicy는 podSelector로 "클러스터 안 Pod"만 보호하므로 외부 VM에는 적용 불가.
#   → 보호는 sq-data-01 VM 방화벽(K8s 노드 IP만 6379 허용) + Redis requirepass로 대체한다.
#   (참고: 향후 default-deny egress를 도입하면 collector/archiver의 egress에
#    192.168.0.101:6379 허용 규칙을 추가해야 한다.)