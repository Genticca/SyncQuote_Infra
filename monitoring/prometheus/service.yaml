# prometheus/service.yaml
# 내부 전용(ClusterIP). Grafana가 클러스터 DNS(http://prometheus:9090)로만 조회.
# 외부/LAN 노출 없음.
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
  - name: http
    protocol: TCP
    port: 9090
    targetPort: 9090
