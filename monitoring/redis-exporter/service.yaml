# redis-exporter/service.yaml
# 내부 전용(ClusterIP). Prometheus가 redis-exporter:9121/metrics로 스크레이프.
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
  namespace: monitoring
  labels:
    app: redis-exporter
spec:
  type: ClusterIP
  selector:
    app: redis-exporter
  ports:
  - name: http
    protocol: TCP
    port: 9121
    targetPort: 9121
