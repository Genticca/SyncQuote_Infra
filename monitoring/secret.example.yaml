# secret.example.yaml
# secret.yaml의 "형태"만 보여주는 템플릿 — 이 파일은 커밋 O.
# 실제 비밀번호가 든 secret.yaml은 .gitignore로 제외(커밋 X). kustomization에도 넣지 않는다.
#
# 사용:
#   cp secret.example.yaml secret.yaml
#   # 아래 stringData 값을 실제 운영 비밀번호로 채운다 (base64 불필요 — k8s가 처리)
#   kubectl apply -f secret.yaml      # monitoring 네임스페이스에 생성
apiVersion: v1
kind: Secret
metadata:
  name: monitoring-secret             # grafana / redis-exporter deployment의 secretKeyRef.name과 일치
  namespace: monitoring
type: Opaque
stringData:
  grafana-admin-user: "admin"
  grafana-admin-password: "CHANGE_ME" # Grafana 관리자 비번 — 반드시 강력하게
  redis-password: "CHANGE_ME"         # sq-data-01 Redis requirepass (default/app-secret의 redis-password와 동일 값)
