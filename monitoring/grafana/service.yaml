# grafana/service.yaml
# 내부 전용(ClusterIP) — 노드에 열린 포트 0. 외부/LAN 어디에도 노출하지 않는다.
# 접근은 SSH 터널 또는 kubectl port-forward로만:
#   kubectl -n monitoring port-forward svc/grafana 3000:3000     → http://localhost:3000
#   원격: ssh -L 3000:localhost:3000 <user>@172.16.116.10  와 조합
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
  - name: http
    protocol: TCP
    port: 3000
    targetPort: 3000
