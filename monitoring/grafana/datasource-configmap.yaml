# grafana/datasource-configmap.yaml
# Grafana 프로비저닝: 기동 시 Prometheus 데이터소스를 자동 등록(수동 설정 불필요).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
