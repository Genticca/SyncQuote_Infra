# redis-api.yaml
# Redis API용

apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-api
  labels:
    app: redis-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-api
  template:
    metadata:
      labels:
        app: redis-api
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
      containers:
      - name: redis
        image: redis:7.2
        ports:
        - containerPort: 6379
        command: ["redis-server"]
        args:
        - "--maxmemory"
        - "180mb"                      # [Fix] 컨테이너 메모리 마진 확보 및 픽스
        - "--maxmemory-policy"
        - "allkeys-lru"
        - "--appendonly"
        - "no"
        resources:
          requests:
            memory: "256Mi"            # [Fix] Guaranteed 등급 확보를 위한 동일 값 고정
            cpu: "200m"
            ephemeral-storage: "512Mi"
          limits:
            memory: "256Mi"            # [Fix]
            cpu: "300m"
            ephemeral-storage: "512Mi"
        livenessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: redis-data
          mountPath: /data
      volumes:
      - name: redis-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis-api-service
spec:
  selector:
    app: redis-api
  ports:
  - name: redis
    protocol: TCP
    port: 6379
    targetPort: 6379
  type: ClusterIP                      # 클러스터 내부망 전용 고정