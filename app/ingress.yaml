# ingress.yaml
# 외부 사용자가 도메인 or IP 접속 시 클러스터 내부의 api-service로 연결되도록 Ingress 설정

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-server-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"              # Nginx Ingress Controller 사용 명시
    nginx.ingress.kubernetes.io/proxy-body-size: "10m" # 업로드 파일 용량 제한 10mb
spec:
  rules:
  - host: "api.yourdomain.com"          # 실제 서비스할 도메인으로 변경
                                        # IP 직접 접근 시 host 라인 삭제 가능
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-service           # api-service.yaml의 metadata.name과 반드시 일치
            port:
              number: 80                # api-service.yaml의 port(80)와 반드시 일치