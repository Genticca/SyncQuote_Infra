# redis-collector.yaml
# collector용 Redis 배포 / collector Pod 전용 캐시 Redis

apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-collector
  namespace: default                        # [추가] namespace 명시
  labels:
    app: redis-collector                    # Service/NetworkPolicy에서 이 label로 Pod를 찾아 트래픽 전달
spec:
  replicas: 1                               # Redis 단일 인스턴스 / 여러 개 띄우면 데이터 불일치 발생
  selector:
    matchLabels:
      app: redis-collector                  # 위 labels와 반드시 일치해야 Deployment가 Pod 인식
  template:
    metadata:
      labels:
        app: redis-collector                # NetworkPolicy에서 이 label로 접근 제어
    spec:
      automountServiceAccountToken: false   # 불필요한 K8s API 접근 차단 / 보안 강화
      nodeSelector:
        node-role.kubernetes.io/worker: "true"  # worker 노드에만 배치
                                                # 나중에 Redis VM 전용 라벨로 커스텀 가능
      containers:
      - name: redis
        image: redis:7.2                    # 고정 버전 사용 / latest 사용 시 예기치 않은 업데이트 위험
        ports:
        - containerPort: 6379               # Redis 기본 포트
        command: ["redis-server"]
        args:
        - "--maxmemory"
        - "180mb"                           # limits(256Mi) 대비 마진 확보
                                            # Redis 자체 오버헤드 공간 확보 → OOMKilled 방지
        - "--maxmemory-policy"
        - "allkeys-lru"                     # 메모리 초과 시 가장 오래 사용되지 않은 키부터 제거
                                            # 수집 데이터 캐시 용도에 최적
        - "--appendonly"
        - "no"                              # AOF(디스크 영속화) 비활성화
                                            # 캐시 용도라 재시작 시 데이터 초기화 허용
        - "--requirepass"                   # [보안] 패스워드 인증 활성화 / redis-api와 동일 보안 수준
        - "$(REDIS_PASSWORD)"               # env에서 주입된 비밀번호를 args로 바인딩
        env:
        - name: REDIS_PASSWORD              # [보안] Secret에서 Redis 비밀번호 안전하게 주입
          valueFrom:
            secretKeyRef:
              name: app-secret              # secret.yaml의 metadata.name과 일치
              key: redis-password           # secret.yaml의 data 키와 일치
        resources:
          requests:
            memory: "256Mi"                 # requests == limits → Guaranteed QoS 등급 확보
            cpu: "200m"                     # 0.2 core 보장 / Redis는 싱글스레드라 CPU 많이 안 씀
            ephemeral-storage: "512Mi"      # 임시 스토리지 고정 / Guaranteed 완전체 조건
          limits:
            memory: "256Mi"                 # 원칙2: 메모리 완전 Fix / requests와 동일하게 유지
            cpu: "300m"                     # 최대 0.3 core / 순간 스파이크 대비
            ephemeral-storage: "512Mi"      # requests와 동일하게 유지
        livenessProbe:                      # 컨테이너 생존 여부 체크 / 실패 시 Pod 재시작
          exec:
            # [수정] -a 옵션은 ps aux에 비밀번호 노출 위험
            # → redis-cli -u 방식으로 비밀번호 안전하게 전달
            command: ["sh", "-c", "redis-cli -u redis://:$(REDIS_PASSWORD)@localhost:6379 ping"]
          initialDelaySeconds: 15           # Redis 기동 후 15초 뒤부터 체크 시작
          periodSeconds: 20                 # 20초마다 ping 체크
          failureThreshold: 3               # 3번 연속 실패 시 Pod 재시작
        readinessProbe:                     # 트래픽 수신 준비 여부 체크 / 실패 시 Service 대상 제외
          exec:
            command: ["sh", "-c", "redis-cli -u redis://:$(REDIS_PASSWORD)@localhost:6379 ping"]
          initialDelaySeconds: 5            # liveness보다 짧게 / 준비되는 즉시 트래픽 받도록
          periodSeconds: 10                 # 10초마다 체크
          failureThreshold: 3               # 3번 연속 실패 시 로드밸런싱 대상 제외
        volumeMounts:
        - name: redis-data
          mountPath: /data                  # Redis 데이터 저장 경로
      volumes:
      - name: redis-data
        emptyDir: {}                        # Pod 재시작 시 데이터 초기화 / 캐시 용도라 영속성 불필요
---
apiVersion: v1
kind: Service
metadata:
  name: redis-collector-service             # collector-deployment.yaml의 REDIS_URL 환경변수 값과 반드시 일치
  namespace: default                        # [추가] Deployment와 동일한 namespace
  labels:
    app: redis-collector                    # [추가] 관리 편의성을 위한 label
spec:
  selector:
    app: redis-collector                    # redis-collector Deployment의 Pod label과 일치
  ports:
  - name: redis
    protocol: TCP
    port: 6379                              # Service가 외부(다른 Pod)에 노출하는 포트
    targetPort: 6379                        # 실제 Redis Pod 컨테이너 포트
  type: ClusterIP                           # 클러스터 내부망 전용
                                            # NetworkPolicy로 collector Pod만 접근 허용