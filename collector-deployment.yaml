# collector-deployment.yaml
# 데이터 수집기 배포

apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector-deployment
  namespace: default                        # [추가] namespace 명시
  labels:
    app: collector
spec:
  replicas: 1                               # 싱글톤 전제 / 2개 이상이면 중복 수집 발생
  selector:
    matchLabels:
      app: collector
  template:
    metadata:
      labels:
        app: collector
    spec:
      automountServiceAccountToken: false   # 불필요한 K8s API 접근 차단 / 보안 강화
      nodeSelector:
        node-role.kubernetes.io/worker: "true"  # worker 노드에만 배치
      containers:
      - name: collector
        image: my-repo/bitcoin-dashboard:v1.0.0  # 단일 이미지 / 프로파일로 모드 분기
        ports:
        - containerPort: 8080               # Spring Boot 내장 톰캣 포트
          name: http
          protocol: TCP
        resources:
          requests:
            memory: "512Mi"                 # requests == limits → Guaranteed QoS 등급 확보
            cpu: "250m"                     # 0.25 core 보장
            ephemeral-storage: "1Gi"        # 스토리지 고정 / Guaranteed 완전체 조건
          limits:
            memory: "512Mi"                 # 원칙2: 메모리 완전 Fix
            cpu: "500m"                     # 최대 0.5 core / 초과 시 throttling
            ephemeral-storage: "1Gi"
        livenessProbe:                      # 컨테이너 생존 여부 체크 / 실패 시 Pod 재시작
          httpGet:
            path: /actuator/health/liveness # Spring Boot 2.3+ 표준 엔드포인트
            port: 8080
          initialDelaySeconds: 40           # 스프링 부트 완전 구동까지 대기
          periodSeconds: 30                 # 30초마다 체크
          failureThreshold: 3               # 3번 연속 실패 시 Pod 재시작
        readinessProbe:                     # 트래픽 수신 준비 여부 체크 / 실패 시 로드밸런싱 대상 제외
          httpGet:
            path: /actuator/health/readiness # Spring Boot 2.3+ 표준 엔드포인트
            port: 8080
          initialDelaySeconds: 20           # liveness보다 짧게 / 준비되는 즉시 트래픽 받도록
          periodSeconds: 15                 # 15초마다 체크
          failureThreshold: 3               # 3번 연속 실패 시 로드밸런싱 대상 제외
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "collector"                # collector 모드로 기동
        - name: MODE
          value: "COLLECTOR"               # 앱 내부에서 Collector/API 모드 분기 처리용
        - name: REDIS_URL
          value: "redis-collector-service"  # 원칙1: collector 전용 Redis 분리
                                            # K8s DNS가 Service명 → ClusterIP로 자동 변환
        - name: REDIS_PORT
          value: "6379"                     # Redis 기본 포트
        - name: REDIS_PASSWORD              # [추가] redis-collector에 requirepass 설정했으므로 반드시 필요
          valueFrom:
            secretKeyRef:
              name: app-secret              # secret.yaml의 name과 일치
              key: redis-password           # secret.yaml의 key와 일치
        - name: DB_URL
          value: "mysql-service"            # 아카이빙용 MySQL Service 이름
                                            # K8s DNS가 Service명 → ClusterIP → Endpoints IP로 변환
        - name: DB_PORT
          value: "3306"                     # MySQL 기본 포트
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret              # secret.yaml의 name과 일치
              key: mysql-password           # secret.yaml의 key와 일치