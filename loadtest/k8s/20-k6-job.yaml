# 20-k6-job.yaml
# k6 부하를 "한 번 실행하고 끝나는" Job으로 실행.
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-loadtest
  namespace: loadtest
  labels:
    app: k6-loadtest
spec:
  ttlSecondsAfterFinished: 600   # 완료 10분 후 자동 삭제 (재실행 충돌 방지)
  backoffLimit: 0                # 실패해도 재시도 안 함 (부하는 1회성)
  template:
    metadata:
      labels:
        app: k6-loadtest
    spec:
      restartPolicy: Never
      # ⚠️ 단일 노드라 측정 대상과 같은 노드에서 돌 수밖에 없다.
      #    부하기가 노드 자원을 과하게 먹으면 측정 대상(api Pod)을 굶겨 결과가 오염된다.
      #    → 아래 limits로 부하기 자원을 고정해 오염을 최소화한다.
      #    노드를 추가했다면 nodeSelector로 부하기를 다른 노드에 격리하는 게 이상적.
      containers:
      - name: k6
        image: grafana/k6:0.49.0
        command: ["k6", "run", "/scripts/script.js"]
        args: ["--summary-trend-stats", "avg,min,med,max,p(90),p(95),p(99)"]
        # 외부 노출 주소가 아니라 클러스터 내부 Service를 치므로 BASE_URL은 기본값 사용.
        # 필요 시 env로 오버라이드 가능.
        # env:
        # - name: BASE_URL
        #   value: "http://api-service.default.svc.cluster.local"
        resources:
          requests:
            cpu: "300m"
            memory: "128Mi"
          limits:
            cpu: "1000m"          # 부하기 CPU 상한 1코어 고정 (오염 방지)
            memory: "256Mi"
        volumeMounts:
        - name: script
          mountPath: /scripts
      volumes:
      - name: script
        configMap:
          name: k6-script        # 10-k6-script-configmap.yaml 의 이름과 일치
