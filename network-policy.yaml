# network-policy.yaml
# Redis api / collector 간 접근 제어 방화벽

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-api-strict-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: redis-api                # 대상: API용 Redis Pod
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: api                  # 오직 서비스 WAS(api)만 진입 허용
    ports:
    - protocol: TCP
      port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-collector-strict-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: redis-collector          # 대상: 수집용 Redis Pod
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: collector            # 오직 수집기(collector)만 진입 허용
    ports:
    - protocol: TCP
      port: 6379