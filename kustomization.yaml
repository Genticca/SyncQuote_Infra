# kustomization.yaml (root)
# 전체를 한 번에 적용: kubectl apply -k .
# kustomize가 kind 기준으로 정렬 적용(Namespace→Service→Endpoints→…→Deployment)하므로
# 디렉토리 나열 순서와 무관하게 의존성 순서가 대체로 맞는다.
#
# [주의] Secret(shared/secret.yaml)은 민감정보라 여기 포함하지 않는다.
#        먼저 따로 적용: kubectl apply -f shared/secret.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - mysql
  - data
  - web
