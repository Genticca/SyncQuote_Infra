# secret.example.yaml
# secret.yaml의 "형태"만 보여주는 템플릿 — 이 파일은 커밋 O.
# 실제 비밀번호가 든 secret.yaml은 .gitignore로 제외(커밋 X).
#
# 사용:
#   cp secret.example.yaml secret.yaml
#   # 아래 stringData 값을 실제 운영 비밀번호로 채운다 (base64 인코딩 불필요 — k8s가 자동 처리)
#   kubectl apply -f secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: app-secret                    # api/collector/archiver deployment의 secretKeyRef.name과 일치
  namespace: default
type: Opaque
stringData:
  mysql-password: "CHANGE_ME"         # sq-mysql-01 MySQL 실제 비밀번호
  redis-password: "CHANGE_ME"         # redis-api / redis-collector requirepass 값
  # external-api-key: "CHANGE_ME"     # (현재 미사용 — 필요 시 주석 해제 후 deployment에 배선)
