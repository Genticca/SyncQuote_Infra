# secret.yaml
# kubectl apply -f secret.yaml 로 적용
# 주의: 이 파일은 절대 git에 올리면 안 됨 / .gitignore에 추가 필수
apiVersion: v1
kind: Secret
metadata:
  name: app-secret                    # collector/api deployment의 secretKeyRef.name과 반드시 일치
  namespace: default                  # deployment와 동일한 namespace여야 참조 가능
type: Opaque                          # 일반 key-value 시크릿 타입 / TLS, SSH 등 특수 타입과 구분
data:
  # [중요] 아래 값들은 평문이 아닌 base64 인코딩된 값이어야 함
  # 인코딩 방법: echo -n '실제비밀번호' | base64
  # 디코딩 방법: echo 'bXlzcWwxMjM=' | base64 --decode
  # 주의: echo (공백 포함) 대신 echo -n (공백 제외) 사용해야 정확한 값 인코딩됨

  mysql-password: bXlzcWwxMjM=        # 'mysql123' 인코딩 값
                                      # collector/api deployment DB_PASSWORD에서 참조
                                      # 실제 배포 시 운영 DB 비밀번호로 교체 필수

  redis-password: bXktcmVkaXMtcGFzc3dvcmQ=  # 'my-redis-password' 인코딩 값
                                              # Redis 인증 사용 시 redis-collector/api deployment에서 참조
                                              # 현재 redis deployment에 --requirepass 미설정 시 미사용

  external-api-key: dG9rZW4tMTIzNDU=  # 'token-12345' 인코딩 값
                                      # 업비트/바이낸스 등 외부 거래소 API 인증 토큰
                                      # collector deployment EXTERNAL_API_KEY에서 참조

# -----------------------------------------------
# [deployment 연동 예시]
#
# collector-deployment.yaml / api-deployment.yaml 공통:
# env:
# - name: DB_PASSWORD
#   valueFrom:
#     secretKeyRef:
#       name: app-secret          # 이 파일의 metadata.name과 일치
#       key: mysql-password       # 이 파일의 data 키 이름과 일치
#
# - name: REDIS_PASSWORD
#   valueFrom:
#     secretKeyRef:
#       name: app-secret
#       key: redis-password
#
# - name: EXTERNAL_API_KEY
#   valueFrom:
#     secretKeyRef:
#       name: app-secret
#       key: external-api-key
# -----------------------------------------------

# -----------------------------------------------
# [보안 주의사항]
# 1. .gitignore에 secret.yaml 추가
#    echo "secret.yaml" >> .gitignore
# 2. 운영 환경에선 Vault, AWS Secrets Manager 등 외부 시크릿 매니저 연동 권장
# 3. kubectl get secret app-secret -o yaml 로 현재 적용된 값 확인 가능
#    (base64 인코딩 상태로 보임 / 평문 노출 아님)
# -----------------------------------------------