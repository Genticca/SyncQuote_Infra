name: Deploy SyncQuote Collector Prod

# 한 이미지(syncquote-collector)를 collector / archiver 두 Deployment에 배포한다.
on:
  push:
    branches:
      - main
    paths:
      - 'crypto-collector/**'        # 매니페스트만 바꾼 커밋은 이미지 재빌드 스킵
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: syncquote-collector-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: syncquote-collector
  K8S_NAMESPACE: default

jobs:
  test:
    name: Build & Vet (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: crypto-collector/go.sum
      - name: go build & vet
        working-directory: crypto-collector
        run: |
          go build ./...
          go vet ./...

  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image tags
        id: image
        run: |
          IMAGE="${REGISTRY}/${{ github.repository_owner }}/${IMAGE_NAME}"
          IMAGE="${IMAGE,,}"
          echo "image=${IMAGE}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_SHA=${IMAGE}:${{ github.sha }}" >> "$GITHUB_ENV"
          echo "IMAGE_LATEST=${IMAGE}:latest" >> "$GITHUB_ENV"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./crypto-collector
          file: ./crypto-collector/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_SHA }}
            ${{ env.IMAGE_LATEST }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Kubernetes
    # self-hosted runner + 클러스터가 준비됐을 때만 실행 (repo 변수 DEPLOY_ENABLED=true).
    # 미설정이면 skipped → 빌드/푸시까지만 완료되어 무기한 Pending·실패 Deployment 방지.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: [self-hosted, linux, x64]
    needs: build-and-push
    environment: production
    steps:
      - name: Check Kubernetes access
        run: |
          command -v kubectl
          kubectl config current-context
          kubectl -n "$K8S_NAMESPACE" get deployment/collector-deployment
          kubectl -n "$K8S_NAMESPACE" get deployment/archiver-deployment
      - name: Update collector & archiver images (동일 이미지)
        run: |
          IMAGE="${{ needs.build-and-push.outputs.image }}"
          kubectl -n "$K8S_NAMESPACE" set image deployment/collector-deployment collector="$IMAGE"
          kubectl -n "$K8S_NAMESPACE" set image deployment/archiver-deployment  archiver="$IMAGE"
      - name: Wait for rollout
        run: |
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/collector-deployment --timeout=120s
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/archiver-deployment  --timeout=120s
