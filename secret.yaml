apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: default
type: Opaque
data:
  # 예: 비밀번호가 'mysql123'인 경우 인코딩된 값 입력
  mysql-password: bXlzcWwxMjM=        
  
  # Redis 비밀번호 설정을 추가할 경우 인코딩해서 사용 (미사용 시 제외 가능)
  redis-password: bXktcmVkaXMtcGFzc3dvcmQ= 

  # collector가 사용할 외부 타겟 API 키나 크롤링 인증 토큰이 있다면 여기에 추가
  external-api-key: dG9rZW4tMTIzNDU=


# app 연결 방식
# (api-deployment or collector-deployment에서 아래와 같이 맵핑
# env:
# - name: DB_PASSWORD
#   valueFrom:
#     secretKeyRef:
#       name: app-secret
#       key: mysql-password