# api-deployment.yaml
# API WAS 배포

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  namespace: default                        # [추가] namespace 명시
  labels:
    app: api
spec:
  replicas: 2                               # 다이어그램 기준 API Pod A, B 2개 / 1개면 단일 장애점(SPOF) 발생
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api                            # Service(api-service)가 이 라벨을 보고 로드밸런싱 수행
    spec:
      automountServiceAccountToken: false   # 불필요한 K8s API 접근 차단 / 보안 강화
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
      imagePullSecrets:
      - name: ghcr-secret                   # GHCR private 이미지 pull용 (docker-registry secret)
      containers:
      - name: api-server
        image: ghcr.io/genticca/syncquote-was:latest  # CI(deploy-prod.yml)가 배포 시 :sha로 교체 / SPRING_PROFILES_ACTIVE=api → prod
        ports:
        - containerPort: 80                 # 앱이 실제 listening하는 포트
          name: http
          protocol: TCP
        securityContext:                    # [하드닝] 무위험 베이스라인만.
                                            # 포트 80(<1024) 바인딩 + 루트 기반 JRE 이미지라
                                            # runAsNonRoot/drop ALL은 이미지 수정(nonroot+8080) 후 가능.
          allowPrivilegeEscalation: false   # setuid 권한 상승 차단 (루트여도 안전)
          seccompProfile:
            type: RuntimeDefault            # 기본 syscall 필터 적용
        resources:
          requests:
            memory: "256Mi"                 # requests == limits → Guaranteed 등급
            cpu: "200m"                     # 0.2 core 보장 / 1000m = 1core
            ephemeral-storage: "1Gi"        # 스토리지 고정 / Guaranteed 완전체
          limits:
            memory: "256Mi"                 # 원칙2: 메모리 완전 Fix
            cpu: "500m"                     # 최대 0.5 core / 초과 시 throttling
            ephemeral-storage: "1Gi"
        livenessProbe:                      # 컨테이너 생존 여부 체크 / 실패 시 Pod 재시작
          httpGet:
            path: /actuator/health/liveness # Spring Boot 2.3+ 표준 엔드포인트
            port: 80
          initialDelaySeconds: 40           # 스프링 부트 완전 구동까지 대기
          periodSeconds: 20
          failureThreshold: 3
        readinessProbe:                     # 트래픽 수신 준비 여부 체크 / 실패 시 로드밸런싱 대상 제외
          httpGet:
            path: /actuator/health/readiness # Spring Boot 2.3+ 표준 엔드포인트
            port: 80
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 3
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "api"                      # api 모드로 기동
        - name: MODE
          value: "API"                      # 앱 내부에서 Collector/API 모드 분기 처리용
        - name: DB_URL
          value: "mysql-service"            # K8s Service 이름 / IP 대신 사용 (IP는 재시작마다 바뀜)
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret              # secret.yaml의 name과 일치
              key: mysql-password           # secret.yaml의 key와 일치
        - name: REDIS_URL
          value: "redis-collector-service"  # 라이브 ticker/candle/market/meta는 전부 redis-collector에 적재됨.
                                            # WAS는 순수 소비자(Redis에 쓰기 0건)라 redis-api는 미사용 → 스트림 소스를 직접 가리킨다.
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_PASSWORD              # [추가] redis-api에 requirepass 설정했으므로 반드시 필요
          valueFrom:
            secretKeyRef:
              name: app-secret              # secret.yaml의 name과 일치
              key: redis-password           # secret.yaml의 key와 일치