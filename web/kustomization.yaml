# web/kustomization.yaml
# Web Service VM(sq-k8s-01) 계층을 한 단위로 적용: kubectl apply -k web/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - api-deployment.yaml
  - api-service.yaml
  - front-deployment.yaml
  - front-service.yaml
  - ingress.yaml
  - pdb.yaml
  - hpa.yaml
# [확장 여지 — 지금은 비활성]
