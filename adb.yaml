# adb.yaml
# API 서버 PodDisruptionBudget 설정
# PodDisruptionBudget(PDB) = 클러스터 관리자가 노드 유지보수, 업그레이드 등으로 인해 Pod를 강제로 종료해야 할 때, 최소한의 Pod 수를 유지하도록 보장하는 정책
# 서비스 가용성을 확보

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-server-pdb
  namespace: default
spec:
  # 최소한 1개의 API Pod는 무조건 구동 상태를 유지하도록 강제
  # (minReplicas가 2이므로, 1개가 죽더라도 나머지 1개는 교체될 때까지 죽지 않음)
  minAvailable: 1
  selector:
    matchLabels:
      app: api                         # 대상: api-deployment의 Pod 라벨